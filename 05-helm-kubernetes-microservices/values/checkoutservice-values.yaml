app:
  name: checkoutservice
  namespace: app
  image: gcr.io/google-samples/microservices-demo/checkoutservice
  version: v0.8.0
  replicaCount: 1
  containerPort: 5050
  envVars:
  - name: PORT
    value: "5050"
  - name: PRODUCT_CATALOG_SERVICE_ADDR
    value: "productcatalogservice:5007"
  - name: CART_SERVICE_ADDR
    value: "cartservice:5001"
  - name: SHIPPING_SERVICE_ADDR
    value: "shippingservice:5009"
  - name: CURRENCY_SERVICE_ADDR
    value: "currencyservice:5003"
  - name: PAYMENT_SERVICE_ADDR
    value: "paymentservice:5006"
  - name: EMAIL_SERVICE_ADDR
    value: "emailservice:5004"

servicePort: 5002