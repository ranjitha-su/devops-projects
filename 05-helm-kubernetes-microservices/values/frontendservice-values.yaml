app:
  name: frontend
  namespace: app
  image: gcr.io/google-samples/microservices-demo/frontend
  version: v0.8.0
  replicaCount: 1
  containerPort: 8080
  envVars:
  - name: PORT
    value: "8080"
  - name: AD_SERVICE_ADDR
    value: "adservice:5000"
  - name: RECOMMENDATION_SERVICE_ADDR
    value: "recommendationservice:5008"
  - name: PRODUCT_CATALOG_SERVICE_ADDR
    value: "productcatalogservice:5007"
  - name: CART_SERVICE_ADDR
    value: "cartservice:5001"
  - name: SHIPPING_SERVICE_ADDR
    value: "shippingservice:5009"
  - name: CURRENCY_SERVICE_ADDR
    value: "currencyservice:5003"
  - name: CHECKOUT_SERVICE_ADDR
    value: "checkoutservice:5002"

servicePort: 5005
#type: LoadBalancer