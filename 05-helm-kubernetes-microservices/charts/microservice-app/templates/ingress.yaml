{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ms-app-ingress
  namespace: app
spec:
  ingressClassName: nginx
  rules:
    - host: "demo-onlineshopping-app.com"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: {{ .Values.ingress.backendService }}
                port:
                  number: 5005
{{- end}}
